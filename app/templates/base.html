<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Inicio{% endblock %} | Tu Viaje a Medida</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lovers+Quarrel&display=swap" rel="stylesheet">
</head>

<body>

  <header>
    <h1 class="lovers-quarrel-regular">Tu Viaje a Medida</h1>
    <nav>
      <a href="{{ url_for('inicio') }}">Inicio</a>
      <a href="{{ url_for('lista_destinos') }}">Destinos</a>
      <a href="{{ url_for('lista_alojamientos') }}">Alojamientos</a>
      <a href="{{ url_for('lista_actividades') }}">Actividades</a>
      <a href="{{ url_for('explorador_destinos') }}">Explorador</a>
      <a href="{{ url_for('comparador_alojamientos') }}">Comparador</a>
      <a href="{{ url_for('asistente_viaje') }}">Viaje a medida</a>
      <a href="{{ url_for('acerca') }}">Acerca de nosotros</a>
    </nav>
  </header>

  <div class="contenedor">
    {% block content %}{% endblock %}
  </div>

  <footer>
    <p>Tu Viaje a Medida - Agencia de viajes personalizados</p>
    <small>Desarrollado por Mike y Alexey</small>
  </footer>

</body>

</html>
