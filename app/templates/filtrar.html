{% extends "base.html" %}

{% block title %}Filtrar{% endblock %}

{% block content %}
<h1>Filtrar Productos</h1>
<form action="{{ url_for('filtrar_data') }}" method="get">
    <p>Filtrar por precio:</p>
    <p>
        <label for="precio_min">Precio mínimo:</label>
        <input type="number" id="precio_min" name="precio_min" step="1" value="0">
    </p>
    <p>
        <input type="submit" value="Filtrar">
    </p>
</form>
{% endblock %}
